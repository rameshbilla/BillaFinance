<router-outlet></router-outlet>
<app-toast></app-toast>

<!-- Global Floating Dark Mode Toggle -->
<button (click)="toggleDarkMode()" style="bottom: 30px;"
  class="fixed right-4 p-3 rounded-full bg-white dark:bg-gray-800 shadow-lg dark:shadow-purple-900/50 border border-gray-200 dark:border-gray-700 z-[110] hover:scale-110 transition-all duration-300 group"
  aria-label="Toggle Dark Mode">
  @if (isDarkMode) {
  <!-- Sun Icon for Light Mode -->
  <svg class="w-6 h-6 text-yellow-400 group-hover:rotate-45 transition-transform" fill="none" stroke="currentColor"
    viewBox="0 0 24 24">
    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
      d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z">
    </path>
  </svg>
  } @else {
  <!-- Moon Icon for Dark Mode -->
  <svg class="w-6 h-6 text-indigo-600 group-hover:-rotate-12 transition-transform" fill="none" stroke="currentColor"
    viewBox="0 0 24 24">
    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
      d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path>
  </svg>
  }
</button>
