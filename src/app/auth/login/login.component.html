<div
  class="min-h-screen flex items-center justify-center bg-gradient-to-br from-indigo-900 via-purple-900 to-black text-white relative overflow-hidden">

  <!-- Decorative Background Glows -->
  <div class="absolute top-0 left-0 w-96 h-96 bg-purple-600 rounded-full mix-blend-screen filter blur-[128px] opacity-40"></div>
  <div class="absolute bottom-0 right-0 w-96 h-96 bg-pink-600 rounded-full mix-blend-screen filter blur-[128px] opacity-40"></div>
  <!-- Extra subtle glow bottom-left -->
  <div class="absolute bottom-0 left-0 w-64 h-64 bg-indigo-400 rounded-full mix-blend-screen filter blur-[100px] opacity-20"></div>

  <!-- Glassmorphic Login Card -->
  <div class="relative w-full max-w-md px-6 py-8 sm:px-10 sm:py-12 mx-4 bg-white/10 backdrop-blur-xl border border-white/10 rounded-[2rem] shadow-2xl transition-all duration-300">

    <!-- Logo + Title -->
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-gradient-to-br from-purple-500 to-pink-500 shadow-lg shadow-purple-500/30 mb-4">
        <svg class="w-7 h-7 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
        </svg>
      </div>
      <h1 class="text-3xl sm:text-4xl font-extrabold tracking-tight bg-clip-text text-transparent bg-gradient-to-r from-purple-300 to-pink-300 mb-2">
        FinServe
      </h1>
      <p class="text-purple-200/80 font-medium text-sm">Welcome back. Please enter your details.</p>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-5">

      <!-- Username Input -->
      <div>
        <label for="email" class="block text-xs font-bold text-purple-200 uppercase tracking-widest mb-2">Username</label>
        <div class="relative">
          <input type="text" id="email" formControlName="email"
            class="block w-full pl-4 pr-10 py-3.5 bg-white/5 border border-purple-500/30 rounded-xl text-white placeholder-purple-300/40 focus:outline-none focus:ring-2 focus:ring-purple-400 focus:border-transparent transition-all text-sm"
            placeholder="Enter your username">
          <div class="absolute inset-y-0 right-0 flex items-center pr-3 pointer-events-none">
            <svg class="h-4 w-4 text-purple-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
            </svg>
          </div>
        </div>
        @if (loginForm.get('email')?.invalid && loginForm.get('email')?.touched) {
          <p class="mt-1.5 flex text-xs text-pink-300 items-center gap-1">
            <svg class="w-3 h-3 shrink-0" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clip-rule="evenodd"/></svg>
            Username is required.
          </p>
        }
      </div>

      <!-- Password Input with show/hide toggle -->
      <div>
        <label for="password" class="block text-xs font-bold text-purple-200 uppercase tracking-widest mb-2">Password</label>
        <div class="relative">
          <input [type]="showPassword ? 'text' : 'password'" id="password" formControlName="password"
            class="block w-full pl-4 pr-11 py-3.5 bg-white/5 border border-purple-500/30 rounded-xl text-white placeholder-purple-300/40 focus:outline-none focus:ring-2 focus:ring-purple-400 focus:border-transparent transition-all text-sm"
            placeholder="••••••••">
          <!-- Toggle show/hide button -->
          <button type="button" (click)="togglePassword()"
            class="absolute inset-y-0 right-0 flex items-center pr-3 text-purple-400 hover:text-white transition-colors">
            @if (showPassword) {
              <!-- Eye-slash (hide) -->
              <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"/>
              </svg>
            } @else {
              <!-- Eye (show) -->
              <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
              </svg>
            }
          </button>
        </div>
        @if (loginForm.get('password')?.invalid && loginForm.get('password')?.touched) {
          <p class="mt-1.5 flex text-xs text-pink-300 items-center gap-1">
            <svg class="w-3 h-3 shrink-0" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clip-rule="evenodd"/></svg>
            Minimum 6 characters.
          </p>
        }
      </div>

      <!-- Sign In Button -->
      <button type="submit" [disabled]="loginForm.invalid || isLoading()"
        class="w-full flex items-center justify-center gap-2 py-3.5 px-4 rounded-xl text-sm font-bold text-white bg-gradient-to-r from-purple-600 to-pink-600 hover:from-purple-500 hover:to-pink-500 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-purple-500 disabled:opacity-50 disabled:cursor-not-allowed transition-all hover:-translate-y-0.5 hover:shadow-lg hover:shadow-purple-500/30 active:scale-95 mt-2">
        @if (isLoading()) {
          <svg class="animate-spin h-4 w-4" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
          </svg>
          Signing in...
        } @else {
          Sign In
        }
      </button>

    </form>

    <!-- Developer Credit Footer -->
    <div class="mt-8 pt-6 border-t border-white/10 text-center">
      <p class="text-purple-300/60 text-xs font-medium">Developed by</p>
      <p class="text-purple-200 text-sm font-bold mt-0.5">Billa Ramesh</p>
      <a href="tel:8801225025" class="inline-flex items-center gap-1.5 text-pink-400/80 hover:text-pink-300 text-xs font-medium mt-1 transition-colors">
        <svg class="w-3. h-3" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"/>
        </svg>
        8801225025
      </a>
    </div>

  </div>
</div>
