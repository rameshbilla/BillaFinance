<div class="min-h-screen flex items-center justify-center bg-gradient-to-br from-indigo-900 via-purple-900 to-black text-white relative overflow-hidden">

  <!-- Decorative Background Glows -->
  <div class="absolute top-0 left-0 w-96 h-96 bg-purple-600 rounded-full mix-blend-screen filter blur-[128px] opacity-40"></div>
  <div class="absolute bottom-0 right-0 w-96 h-96 bg-pink-600 rounded-full mix-blend-screen filter blur-[128px] opacity-40"></div>
  <div class="absolute bottom-0 left-0 w-64 h-64 bg-indigo-400 rounded-full mix-blend-screen filter blur-[100px] opacity-20"></div>

  <!-- Content Container -->
  <div class="relative z-10 w-full max-w-md px-6 py-8 sm:px-10 sm:py-12 mx-4 bg-white/10 backdrop-blur-xl border border-white/10 rounded-[2rem] shadow-2xl transition-all duration-300">
    
    <!-- Logo + Title -->
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-gradient-to-br from-purple-500 to-pink-500 shadow-lg shadow-purple-500/30 mb-4">
        <svg class="w-7 h-7 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
        </svg>
      </div>
      <h1 class="text-3xl sm:text-4xl font-extrabold tracking-tight bg-clip-text text-transparent bg-gradient-to-r from-purple-300 to-pink-300 mb-2 leading-tight">
        FinServe
      </h1>
      <p class="text-purple-200/80 font-medium text-sm">Welcome back. Please enter your details.</p>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-5">
      
      <!-- Username Input -->
      <div>
        <label for="email" class="block text-xs font-bold text-purple-200 uppercase tracking-widest mb-2 px-1">USERNAME</label>
        <div class="relative">
          <input type="text" id="email" formControlName="email"
            class="block w-full pl-5 pr-12 py-4 bg-white/5 border border-purple-500/30 rounded-xl text-white placeholder-purple-300/40 focus:outline-none focus:ring-2 focus:ring-purple-400 focus:border-transparent transition-all text-sm"
            placeholder="Identity">
          <div class="absolute inset-y-0 right-0 flex items-center pr-4 pointer-events-none text-purple-400">
            <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
            </svg>
          </div>
        </div>
      </div>

      <!-- Password Input -->
      <div>
        <label for="password" class="block text-xs font-bold text-purple-200 uppercase tracking-widest mb-2 px-1">PASSWORD</label>
        <div class="relative">
          <input [type]="showPassword ? 'text' : 'password'" id="password" formControlName="password"
            class="block w-full pl-5 pr-12 py-4 bg-white/5 border border-purple-500/30 rounded-xl text-white placeholder-purple-300/40 focus:outline-none focus:ring-2 focus:ring-purple-400 focus:border-transparent transition-all text-sm font-bold tracking-widest"
            placeholder="••••••••">
          <button type="button" (click)="togglePassword()" class="absolute inset-y-0 right-0 flex items-center pr-4 text-purple-400 hover:text-white transition-colors">
            @if (showPassword) {
              <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
            } @else {
              <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"/></svg>
            }
          </button>
        </div>
      </div>

      <!-- Sign In Button -->
      <button type="submit" [disabled]="loginForm.invalid || isLoading()"
        class="w-full flex items-center justify-center gap-2 py-4 px-4 rounded-xl text-sm font-bold text-white bg-gradient-to-r from-purple-600 to-pink-600 hover:from-purple-500 hover:to-pink-500 focus:outline-none focus:shadow-outline disabled:opacity-50 disabled:cursor-not-allowed transition-all transform active:scale-95 shadow-lg shadow-purple-500/20 mt-4 uppercase tracking-[0.2em]">
        @if (isLoading()) {
          <svg class="animate-spin h-4 w-4" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path></svg>
          VALIDATING...
        } @else {
          SIGN IN →
        }
      </button>

    </form>

    <!-- Footer -->
    <div class="mt-8 pt-6 border-t border-white/10 text-center">
      <p class="text-purple-300/60 text-[10px] font-black uppercase tracking-[0.3em] mb-2">POWERING YOUR BUSINESS</p>
      <div class="flex items-center justify-center gap-4 text-[10px] font-bold text-white/40 mb-4">
        <span>SECURE</span>
        <span class="w-1 h-1 rounded-full bg-white/20"></span>
        <span>ENTERPRISE</span>
        <span class="w-1 h-1 rounded-full bg-white/20"></span>
        <span>ANALYTICS</span>
      </div>
      <p class="text-[10px] font-black text-pink-400/80 uppercase tracking-widest italic">developed by Billa Ramesh, 8801225025</p>
    </div>

  </div>
</div>
